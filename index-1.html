 else if(F){const mm={};L.forEach(x=>{if(!x.h){const k=key(x.n);mm[k]=(mm[k]||0)+x.a}});const t=Object.entries(mm).sort((a,b)=>b[1]-a[1]).slice(0,5);if(t.length)h+=`<div class="card"><h3>בתי עסק מובילים</h3>${t.map(([k,a])=>`<div class="rt"><span>${esc(k)}</span><b>${fm(a)} ₪</b></div>`).join('')}</div>`}
